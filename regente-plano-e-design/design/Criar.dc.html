<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Regente — menu criar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#262624}
a{color:#ECEAE3}a:hover{color:#FFFFFF}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7%)}}
@keyframes sway{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(0.95)}}
@keyframes blink{0%,90%,100%{transform:scaleY(1)}94%{transform:scaleY(0.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.35}}
.pet{transform-origin:50% 100%;overflow:visible}
.pet.work{animation:bob 0.7s ease-in-out infinite}
.pet.think{animation:sway 1.8s ease-in-out infinite}
.pet.wait{animation:breathe 1.4s ease-in-out infinite}
.pet.idle{animation:breathe 3.2s ease-in-out infinite}
.pet .eyes{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.live{animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.pet,.pet .eyes,.live{animation:none !important}}
</style>
</helmet>
<div style="width: 760px; height: 560px; display: flex; background: #262624; color: #ECEAE3; font-family: Inter, system-ui, sans-serif; font-size: 14px; overflow: hidden">
  <nav aria-label="Navegação principal" style="width: 264px; flex: 0 0 auto; box-sizing: border-box; background: #1F1E1D; border-right: 1px solid #33322E; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px">
    <div style="display: flex; align-items: center; gap: 10px; padding: 6px 10px 14px">
      <svg width="22" height="22" viewBox="0 0 16 16" shape-rendering="crispEdges" aria-hidden="true"><rect x="2" y="2" width="12" height="12" fill="#ECC56A"></rect><rect x="5" y="6" width="2" height="2" fill="#1F1E1D"></rect><rect x="9" y="6" width="2" height="2" fill="#1F1E1D"></rect><rect x="5" y="10" width="6" height="1" fill="#1F1E1D"></rect></svg>
      <span style="font-size: 16px; font-weight: 600">Regente</span>
    </div>
    <a href="Criar.dc.html" aria-current="page" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: #2F2E2B"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Criar</a>
    <a href="#" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="M20 20l-4-4"></path></svg>Procurar</a>
    <a href="Skills.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 3L5 13h6l-1 8 8-10h-6l1-8z"></path></svg>Skills</a>
    <a href="Plugins.dc.html" style="display: flex; align-items: center; gap: 10px; padding: 9px 10px; border-radius: 8px; text-decoration: none; font-size: 14px; background: transparent"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v4h4v6h-4v6H9v-6H5V8h4z"></path></svg>Plugins</a>
  </nav>
  <div style="flex: 1; padding: 52px 0 0 12px; background: rgba(0,0,0,0.25)">
    <div role="menu" aria-label="Criar" style="width: 400px; background: #2C2B28; border: 1px solid #3A3934; border-radius: 14px; padding: 8px; display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{opts}}" as="o" hint-placeholder-count="3">
        <a role="menuitem" href="{{o.href}}" style="display: flex; align-items: center; gap: 14px; padding: 12px; border-radius: 10px; text-decoration: none; background: {{o.bg}}">
          <span style="width: 40px; height: 40px; border-radius: 10px; background: #22211F; display: flex; align-items: center; justify-content: center; flex: 0 0 auto">{{o.glyph}}</span>
          <span style="flex: 1; display: flex; flex-direction: column; gap: 2px"><span style="font-weight: 600">{{o.title}}</span><span style="font-size: 12px; color: #A3A19A">{{o.sub}}</span></span>
          <kbd style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #A3A19A; padding: 2px 6px; border: 1px solid #3A3934; border-radius: 5px">{{o.key}}</kbd>
        </a>
      </sc-for>
      <div style="height: 1px; background: #3A3934; margin: 6px 4px"></div>
      <p style="margin: 0; padding: 6px 12px 8px; font-size: 12px; color: #A3A19A; line-height: 1.5">Dica: um projeto novo já pode vir com um time pronto de agentes.</p>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":760,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      opts: [
        { title: 'Nova tarefa', sub: 'Descreva o que o orquestrador deve fazer', key: 'Ctrl N', glyph: 'T', href: 'Main.dc.html', bg: 'transparent' },
        { title: 'Novo agente', sub: 'CLI, papel, pet, projeto e permissões', key: 'Ctrl Shift A', glyph: 'A', href: 'NovoAgente.dc.html', bg: '#34332F' },
        { title: 'Novo projeto', sub: 'Pastas, contexto, anexos e time de agentes', key: 'Ctrl Shift P', glyph: 'P', href: 'NovoProjeto.dc.html', bg: 'transparent' }
      ]
    };
  }
}
</script>
</body>
</html>
